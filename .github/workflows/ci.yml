name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            orchestrator/requirements.txt
            orchestrator/requirements-dev.txt

      - name: Install pinned dependencies
        run: |
          python -m pip install --requirement orchestrator/requirements-dev.txt
          python -m pip check

      - name: Static checks
        run: |
          ruff check .
          ruff format --check .
          python -m compileall -q orchestrator/app orchestrator/tests provisioning tools/swarm.py

      - name: Tests
        env:
          PYTHONPATH: orchestrator
        run: python -m pytest -q orchestrator/tests

      - name: Release assets and model licenses
        run: |
          python provisioning/check_licenses.py
          python provisioning/validate_release.py
          bash -n install.sh provisioning/*.sh

  container:
    name: Compose and container build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Validate Compose
        run: docker compose config --quiet

      - name: Build orchestrator image
        run: docker build --pull --tag llm-swarm-orchestrator:ci orchestrator
