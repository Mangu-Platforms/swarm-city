# Lower-memory roster for development and CPU-first hosts.
agents:
  - role: draft
    model: ${SWARM_CODER_MODEL:-qwen2.5-coder:7b}
    count: ${SWARM_DRAFT_AGENTS:-2}
    temperature: 0.45

  - role: draft
    model: ${SWARM_REASONER_MODEL:-qwen3:8b}
    count: ${SWARM_REASONER_DRAFT_AGENTS:-1}
    temperature: 0.55

  - role: critic
    model: ${SWARM_REVIEW_MODEL:-qwen3:8b}
    count: ${SWARM_QUALITY_REVIEWERS:-1}
    temperature: 0.05
    weight: 1.25

  - role: security
    model: ${SWARM_SECURITY_MODEL:-qwen3:8b}
    count: ${SWARM_SECURITY_REVIEWERS:-1}
    temperature: 0.05
    weight: 1.5

  - role: test_gen
    model: ${SWARM_CODER_MODEL:-qwen2.5-coder:7b}
    count: 1
    temperature: 0.15

  - role: finalizer
    model: ${SWARM_CODER_MODEL:-qwen2.5-coder:7b}
    count: 1
    temperature: 0.10
