[tool.pytest.ini_options]
testpaths = ["orchestrator/tests"]
pythonpath = ["orchestrator"]
asyncio_mode = "auto"
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 88
extend-exclude = [
  "monitoring/grafana",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
ignore = ["B008", "E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
