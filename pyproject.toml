[project]
name = "swarm-city"
version = "0.1.0"
description = "LLM swarm coding orchestrator with a Vercel serverless health surface"
requires-python = ">=3.11"
dependencies = []

[tool.pytest.ini_options]
testpaths = ["orchestrator/tests"]
pythonpath = ["orchestrator"]
asyncio_mode = "auto"
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 88
extend-exclude = [
  "monitoring/grafana",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
ignore = ["B008", "E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.vercel]
entrypoint = "api.health:handler"
