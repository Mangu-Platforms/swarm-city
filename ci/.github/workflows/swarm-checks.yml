# Copy into a target repository as .github/workflows/swarm-checks.yml.
#
# READ THIS BEFORE MAKING IT A REQUIRED CHECK. The detection below is a
# starting point, not something to ship as-is. Replace the "Run repository
# tests" step with your repository's real, deterministic test command,
# including however it installs dependencies. A generic `pip install pytest`
# cannot know about your requirements file, so any project with a third-party
# import fails at collection and the gate goes permanently red.
name: swarm-generated-change

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: swarm-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-generated-change:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        if: ${{ hashFiles('pyproject.toml', 'requirements*.txt', 'tests/**') != '' }}
        with:
          python-version: "3.11"

      - name: Run repository tests
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f pyproject.toml || -d tests ]]; then
            # Install the project first. Tests that cannot import their own
            # dependencies fail at collection, not because the patch is wrong.
            if [[ -f pyproject.toml ]]; then
              python -m pip install -e . || python -m pip install .
            fi
            for requirements in requirements.txt requirements-dev.txt; do
              [[ -f "${requirements}" ]] && python -m pip install -r "${requirements}"
            done
            python -m pip install "pytest==9.0.2"
            python -m pytest -q
          elif [[ -f package-lock.json ]]; then
            npm ci
            npm test
          elif [[ -f pnpm-lock.yaml ]]; then
            corepack enable
            pnpm install --frozen-lockfile
            pnpm test
          elif [[ -f go.mod ]]; then
            go test ./...
          elif [[ -f Cargo.toml ]]; then
            cargo test --all-targets
          else
            echo "No supported deterministic test command detected." >&2
            echo "Replace this step with your repository's test command." >&2
            exit 1
          fi

      - name: Semgrep Community Edition
        # `--config auto` resolves its ruleset over the network at run time, so
        # a green required check can flip red with no code change. Commit a
        # ruleset to the repository and point at it before relying on this.
        run: |
          python -m pip install semgrep==1.172.0
          semgrep scan --config auto --error --metrics=off
