# Copy into a target repository as .github/workflows/swarm-checks.yml.
# Customize the test command for the repository before making it required.
name: swarm-generated-change

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: swarm-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-generated-change:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        if: ${{ hashFiles('pyproject.toml', 'requirements*.txt', 'tests/**') != '' }}
        with:
          python-version: "3.11"

      - name: Run repository tests
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f pyproject.toml || -d tests ]]; then
            python -m pip install pytest
            python -m pytest -q
          elif [[ -f package-lock.json ]]; then
            npm ci
            npm test
          elif [[ -f pnpm-lock.yaml ]]; then
            corepack enable
            pnpm install --frozen-lockfile
            pnpm test
          elif [[ -f go.mod ]]; then
            go test ./...
          elif [[ -f Cargo.toml ]]; then
            cargo test --all-targets
          else
            echo "No supported deterministic test command detected." >&2
            exit 1
          fi

      - name: Semgrep Community Edition
        run: |
          python -m pip install semgrep==1.172.0
          semgrep scan --config auto --error --metrics=off
